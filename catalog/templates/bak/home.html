<!doctype html>
<html lang="ru">
<head>
    <!-- Кодировка веб-страницы -->
    <meta charset="utf-8">
    <!-- Настройка viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Каталог</title>
    <!-- Bootstrap CSS (jsDelivr CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Bundle JS (jsDelivr CDN) -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .nav-item {
            width: 100%;
        }
        .flex-cards {
          display: flex;
          flex-wrap: wrap;
        }

        .flex-cards .card {
          flex: 1;
        }
    </style>

</head>
<body>
{% include "top.html" %}


<div class="pricing-header px-2 pt-md-5 pb-md-4 mx-auto py-5 text-center">
    <h1 class="display-4">Skystore</h1>
    <p class="lead">Skystore - это отличный вариант хранения ваших плагинов и примеров кода, который вы бы хотели
        продать</p>
</div>


<div class="container-fluid text-center">

    <div class="h-100 row text-center flex-cards flex-nowrap pb-5" style="height: 80rem;">

        {% for item in items %}
        <div class="col-auto card-columns mx-auto" style="width: 18rem; height: 25rem;">
            <div class="card mb-5 box-shadow h-100">
                <div class="card-header h-25">
                    <h4 class="my-0 font-weight-normal">{{ item.name }}</h4>
                </div>
                <div class="card-body">
                    <div class="h-75">
                        <h1 class="card-title pricing-card-title">₽ {{ item.price }}</h1>
                        <br>
                        <h4>{{ item.description }}</h4>
                        <script>
                            /*
                        <ul class="list-unstyled mt-3 mb-4 text-start m-3">
                            <li>- Неограниченная лицензия</li>
                            <li>- Поддержка</li>
                            <li>- Установка на сервер</li>
                            <li>- Получение обновлений</li>
                        </ul>
                            */
                        </script>
                    </div>
                    <div class="h-25 float-bottom">
                        <button type="button" class="btn btn-lg btn-outline-primary mb-2 px-5 float-bottom">Купить
                        </button>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    <div class="row h-25">
        <div class="col">
            {% include "bottom.html" %}
        </div>
    </div>

</div>


<!-- Подключите статичеcкие файлы со скриптами Bootstrap -->
</body>
</html>
