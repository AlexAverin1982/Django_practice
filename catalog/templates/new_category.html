{% extends "base.html" %}
{% block title %}Новая категория{% endblock %}
{% block content %}
<div class="px-4 p-3 ms-4 mb-3">
    <h2>Добавление категории</h2>
</div>
<div class="card col col-md-6 px-4 p-3 ms-4 mb-3">
    <form method="post" action="add" class="form-floating">
        {% csrf_token %}
        <div class="mb-3 text-start">
            <label for="category_name" class="form-label">Наименование категории</label>
            <input class="form-control" id="category_name" name="category_name">
        </div>
        <div class="mb-3 text-start">
            <label for="category_desc" class="form-label">Описание</label>
            <textarea class="form-control" id="category_desc" name="category_desc" rows="5"></textarea>
        </div>
        <div class="d-flex container-fluid justify-content-evenly">
            <button type="submit" class="btn btn-primary col-5 p-3">Добавить</button>
            <a href="#" class="btn btn-secondary col-5 p-3" onClick="javascript:history.go(-1);">Отменить</a>
        </div>
    </form>
</div>
{% endblock %}
