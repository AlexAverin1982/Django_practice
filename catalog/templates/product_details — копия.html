{% extends "base.html" %}
{% block title %} {{ product.name }} {% endblock %}
{% block content %}

<div class="container-fluid d-flex border">
    <div class="row" style="height: 40rem;">
        <div class="col-4 border border-primary mx-1">
            <img src={{ product.image }} class="card-img-top" style="height: 40rem;" alt="image">
        </div>
        <div class="col container-fluid flex-nowrap p-2">
            <div class="row mx-1 my-4">
                <h2>{{ product.name }}</h2>
            </div>
            <div class="row mx-1 my-5">
                <h2>{{ product.price }} ₽</h2>
            </div>
            <div class="row mx-1 my-5">
                <h4>{{ product.description }}</h4>
            </div>
            <div class="row-3 container-fluid flex-nowrap p-2">
            </div>
            <div class="row container-fluid flex-nowrap p-2">
            </div>
            <div class="row-4">
<!--                <div class="row-4 container-fluid flex-nowrap p-2">-->
                <button type="button" class="btn btn-lg btn-primary mx-2 px-5 float-bottom">
                    Купить
                </button>
            </div>
        </div>
    </div>
</div>
<div class="row mx-2">
    <h5>
        <small class="text-muted">id:{{ product.id }}</small>
    </h5>
</div>

<button type="button" class="btn btn-lg btn-outline-primary mx-2 px-5 m-3 float-bottom"
        onClick="javascript:history.go(-1);">Назад
</button>

{% endblock %}
